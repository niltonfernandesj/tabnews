name: Linting

on: pull_request

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      # Action criada pela comunidade para baixar para máquina de CI
      # o código na versão específica do pull request realizado.
      - uses: actions/checkout@v4

      # Action criada pela comunidade para definir na máquina de CI
      # a versão do Node a ser utilizada.
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/hydrogen"

      - run: npm ci

      - run: npm run lint:prettier:check
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      # Action criada pela comunidade para baixar para máquina de CI
      # o código na versão específica do pull request realizado.
      - uses: actions/checkout@v4

      # Action criada pela comunidade para definir na máquina de CI
      # a versão do Node a ser utilizada.
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/hydrogen"

      - run: npm ci

      - run: npm run lint:eslint:check
  commitlint:
    name: CommitLint
    runs-on: ubuntu-latest
    steps:
      # Action criada pela comunidade para baixar para máquina de CI
      # o código na versão específica do pull request realizado.
      - uses: actions/checkout@v4
        with:
          # Altera a configuração padrão da action de checkout que só considera
          # o último commit realizado, para considerar todos os commits.
          fetch-depth: 0

      # Action criada pela comunidade para definir na máquina de CI
      # a versão do Node a ser utilizada.
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/hydrogen"

      - run: npm ci

      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
